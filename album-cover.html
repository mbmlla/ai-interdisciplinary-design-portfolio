<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Album cover design project by Bella Maguire."
    />
    <title>Album Cover Design — Bella Maguire</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="project-page">
    <header class="page-frame project-nav">
      <a class="project-nav__name" href="index.html">Bella Maguire</a>
      <nav class="project-nav__links" aria-label="Portfolio navigation">
        <a href="index.html">Home</a>
        <a href="album-cover.html" aria-current="page">Album Cover</a>
        <a href="studio.html">FutureSpace Studio</a>
        <a href="game-proposal.html">Game Proposal</a>
      </nav>
    </header>

    <main>
      <header class="page-frame project-header">
        <h1 class="project-heading">Album Cover Design</h1>
        <p class="project-intro">
          Album artwork for “Losing Control (Satin Jackets Remix)” by Poolside.
        </p>
      </header>

      <section class="page-frame project-section" aria-labelledby="final-cover-title">
        <h2 id="final-cover-title">Final cover</h2>
        <figure class="final-cover-figure">
          <img
            class="final-cover-art"
            src="Albumcoverdone.jpg"
            alt="Complete final album cover for Losing Control by Poolside"
            width="554"
            height="553"
          />
        </figure>
      </section>

      <section class="page-frame project-section" aria-labelledby="cover-process-title">
        <h2 id="cover-process-title">Process</h2>
        <div class="process-grid">
          <figure>
            <img
              src="assets/images/album-process-monochrome.webp"
              alt="Early monochrome flowing-form exploration"
              width="1254"
              height="1254"
              loading="lazy"
            />
            <figcaption>Monochrome exploration</figcaption>
          </figure>
          <figure>
            <img
              src="assets/images/album-process-tonal.webp"
              alt="Refined monochrome flowing-form composition"
              width="1254"
              height="1254"
              loading="lazy"
            />
            <figcaption>Tonal refinement</figcaption>
          </figure>
          <figure>
            <img
              src="assets/images/album-process-color.webp"
              alt="Color development using red, green, ochre, and cream"
              width="1254"
              height="1254"
              loading="lazy"
            />
            <figcaption>Color development</figcaption>
          </figure>
          <figure>
            <img
              src="assets/images/album-process-revised.webp"
              alt="Revised cover composition with a translucent red central circle"
              width="1254"
              height="1254"
              loading="lazy"
            />
            <figcaption>Central-form revision</figcaption>
          </figure>
        </div>
      </section>

      <nav class="page-frame project-footer" aria-label="Project navigation">
        <a href="index.html">Back to home</a>
        <a href="studio.html">Next: FutureSpace Studio</a>
      </nav>
    </main>
  </body>
</html>
